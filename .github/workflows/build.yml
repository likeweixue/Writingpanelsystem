name: 📦 自动打包发布

# 触发方式：
#   1. 推送 v* 标签（如 v1.13.0）→ 打包 Windows exe + macOS dmg，并发布 GitHub Release
#   2. Actions 页面手动运行（workflow_dispatch）→ 只打包上传 artifact，不发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建/发布 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows 打包（exe 安装包）
    runs-on: windows-2022
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包 Windows（仅产出安装包，不发布）
        shell: bash
        run: npm run build-win 2>&1 | tee build-win.log; exit ${PIPESTATUS[0]}

      - name: 📋 记录构建错误（仅失败时，便于排查）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "ci-debug-win-${{ github.run_id }}" --prerelease --title "CI 构建错误(windows) #${{ github.run_id }}" --notes "$(tail -80 build-win.log 2>/dev/null || echo 'no log')" || true

      - name: 📤 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe

  build-mac:
    name: 🍎 macOS 打包（dmg，Intel + Apple Silicon）
    runs-on: macos-14
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包 macOS（双架构，仅产出 dmg，不发布）
        shell: bash
        run: npm run build-mac -- --x64 --arm64 2>&1 | tee build-mac.log; exit ${PIPESTATUS[0]}

      - name: 📋 记录构建错误（仅失败时，便于排查）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "ci-debug-mac-${{ github.run_id }}" --prerelease --title "CI 构建错误(macos) #${{ github.run_id }}" --notes "$(tail -80 build-mac.log 2>/dev/null || echo 'no log')" || true

      - name: 📤 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

  release:
    name: 🚀 发布 GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # 仅当推送标签时才发布 Release；手动触发只产出 artifact
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 📥 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-artifacts'
          merge-multiple: true

      - name: 🚀 创建并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若已存在同名 Release（含草稿），先删除再重建，保证幂等
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "发现已存在的 Release，先删除：$GITHUB_REF_NAME"
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            artifacts/*
