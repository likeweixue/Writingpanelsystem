name: 📦 自动打包发布

# 触发方式：
#   1. 推送 v* 标签（如 v1.13.1）→ 打包 Windows exe + macOS dmg，并发布 GitHub Release
#   2. Actions 页面手动运行（workflow_dispatch）→ 只打包上传 artifact，不发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建/发布 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows 打包（exe 安装包）
    runs-on: windows-2022
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包（仅构建，不发布）
        shell: pwsh
        run: |
          npm run build-win 2>&1 | Tee-Object -FilePath build-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 📤 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-build-log
          path: build-win.log

      - name: 📤 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe

  build-mac:
    name: 🍎 macOS 打包（dmg，Intel + Apple Silicon）
    runs-on: macos-14
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包（仅构建，不发布）
        run: |
          npm run build-mac -- --x64 --arm64 2>&1 | tee build-mac.log
          exit ${PIPESTATUS[0]}

      - name: 📤 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build-mac.log

      - name: 📤 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

  publish-release:
    name: 🚀 发布 GitHub Release（exe + dmg）
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # 仅当推送标签、且两个打包作业都成功时才发布；手动触发不发布
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-windows.result == 'success' &&
      needs.build-mac.result == 'success'
    steps:
      - name: 📥 下载两平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🚀 创建/更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 收集所有产物文件（忽略 artifact 目录结构）
          mapfile -t FILES < <(find artifacts -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::未找到任何产物文件，取消发布"
            exit 1
          fi
          echo "即将发布的文件："
          printf ' - %s\n' "${FILES[@]}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，追加/覆盖资产"
            gh release upload "$GITHUB_REF_NAME" --clobber "${FILES[@]}"
          else
            echo "创建 Release $GITHUB_REF_NAME 并附带资产"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest \
              "${FILES[@]}"
          fi
