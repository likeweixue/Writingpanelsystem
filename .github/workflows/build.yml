name: 📦 自动打包发布

# 触发方式：
#   1. 推送 v* 标签（如 v1.13.1）→ 打包 Windows exe + macOS dmg，并通过 electron-builder 发布 GitHub Release
#   2. Actions 页面手动运行（workflow_dispatch）→ 只打包上传 artifact，不发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建/发布 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows 打包（exe 安装包）
    runs-on: windows-2022
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包并发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # 仅当推送标签时才 --publish always；手动触发只构建不发布
          $publish = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { '--publish','always' } else { @() }
          npm run build-win -- @publish 2>&1 | Tee-Object -FilePath build-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 📤 上传构建日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-build-log
          path: build-win.log

      - name: 📤 上传产物（成功时保留）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe

  build-mac:
    name: 🍎 macOS 打包（dmg，Intel + Apple Silicon）
    runs-on: macos-14
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔧 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 打包并发布到 Release（双架构）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仅当推送标签时才 --publish always；手动触发只构建不发布
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then PUB="--publish always"; else PUB=""; fi
          npm run build-mac -- --x64 --arm64 $PUB 2>&1 | tee build-mac.log
          exit ${PIPESTATUS[0]}

      - name: 📤 上传构建日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build-mac.log

      - name: 📤 上传产物（成功时保留）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/*.dmg

  publish-release:
    name: 🚀 确保 Release 已发布
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # 仅当推送标签时才处理 Release；手动触发不发布
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 🚀 确保 Release 为「已发布」且为 latest（非草稿）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，确保其为已发布且为 latest"
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest || true
          else
            echo "::warning::未找到 $GITHUB_REF_NAME 的 Release，构建作业可能未成功发布，请检查构建日志 artifact（win-build-log / mac-build-log）。"
          fi
